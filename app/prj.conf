CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_CRC=y
CONFIG_UART_CONSOLE=n
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_DMA=y
CONFIG_EMACZ_APP_RAW_UART=y
# emacZero driver from deps/zephyr (patches/zephyr/0004). RX buffers live in
# the overlay's emz_bufs region: 64 stay posted to S2MM and up to 56 more are
# lent to the stack; past that, frames are copied into the 8 copy buffers.
CONFIG_ETH_EMACZERO=y
CONFIG_ETH_EMACZERO_RX_BUFFER_COUNT=128
CONFIG_ETH_EMACZERO_RX_DMA_POST_COUNT=64
CONFIG_ETH_EMACZERO_RX_ZERO_COPY_MAX=56
CONFIG_ETH_EMACZERO_RX_COPY_BUFFER_COUNT=8
CONFIG_ETH_EMACZERO_TX_BUFFER_COUNT=16
CONFIG_NET_IPV4=y
CONFIG_NET_IPV4_MTU=1500
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP_CHECKSUM=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_ZPERF=n
# The perf-stats block mirrors the stack's counters, read through net_mgmt
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_MGMT=y
CONFIG_NET_PKT_FILTER=n
CONFIG_NET_TC_RX_COUNT=0
CONFIG_NET_TC_TX_COUNT=0
# One per frame the driver can have in the stack: lent plus copied, and spare
CONFIG_NET_PKT_RX_COUNT=96
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=1600
CONFIG_DMA_XILINX_AXI_DMA_INTERRUPT_THRESHOLD=32
CONFIG_DMA_XILINX_AXI_DMA_INTERRUPT_TIMEOUT=32
# Fixed descriptor rings. Each must be larger than what the emacZero driver
# keeps queued on it (RX_DMA_POST_COUNT, TX_BUFFER_COUNT), so one descriptor
# always stays free behind the outstanding ones.
CONFIG_DMA_XILINX_AXI_DMA_SG_DESCRIPTOR_NUM_RX=128
CONFIG_DMA_XILINX_AXI_DMA_SG_DESCRIPTOR_NUM_TX=32
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_LOG=n
CONFIG_NET_LOG=n
CONFIG_TEST_RANDOM_GENERATOR=y

# Per-board timer frequency lives in app/boards/<board>.conf so this file
# stays CPU-neutral across the mbv32 and arty_a7_vex targets.
