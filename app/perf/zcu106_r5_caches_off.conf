# Cache-off measurement variant for zcu106_r5: without cache management the
# SoC's early init leaves the I- and D-caches off, as the loader's core
# reset left them. Use with the zcu106_r5_uncached_bufs files.
CONFIG_CACHE_MANAGEMENT=n
