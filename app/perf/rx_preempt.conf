# RX shares the CPU with the TX benchmark under a flood. The driver's RX
# thread and the UDP sink are cooperative by default, so while frames keep
# arriving one of them is always ready and the control thread (priority 4)
# never runs. Here both run at priority 4 too, and time slicing shares the
# CPU among whichever of them are ready. No RX budget: slicing alone shares.
CONFIG_ETH_EMACZERO_RX_THREAD_PREEMPTIBLE=y
CONFIG_ETH_EMACZERO_RX_THREAD_PRIORITY=4
CONFIG_EMACZ_APP_SINK_THREAD_PRIORITY=4
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_PRIORITY=0
# Kconfig warns that prj.conf's ETH_EMACZERO_RX_YIELD_PRIORITY goes unused.
CONFIG_ETH_EMACZERO_RX_BUDGET_US=0
