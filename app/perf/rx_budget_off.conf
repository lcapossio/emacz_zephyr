# The driver's original RX scheduling, for comparison: no RX budget, so under
# a flood the cooperative RX path keeps the CPU and a sender gets none.
# Kconfig warns that prj.conf's ETH_EMACZERO_RX_YIELD_PRIORITY goes unused.
CONFIG_ETH_EMACZERO_RX_BUDGET_US=0
