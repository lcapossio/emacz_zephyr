# Word-aligned socket copies. A UDP payload starts 42 bytes into its frame,
# 2 bytes off a word boundary. The minimal libc memcpy used to copy word by
# word only when source and destination shared their alignment; with
# patches/zephyr/0007 it copies words either way, so this now mostly
# measures what that patch recovered.
#
# RX: the sink buffer starts 2 bytes into a word, as the payload does in the
# frame the DMA wrote. (TX alignment, NET_L2_ETHERNET_RESERVE_HEADER, is on
# in prj.conf.)
CONFIG_EMACZ_APP_PAYLOAD_BUF_OFFSET=2
