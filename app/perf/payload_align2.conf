# Word-aligned socket copies. A UDP payload starts 42 bytes into its frame,
# 2 bytes off a word boundary, and the minimal libc memcpy copies word by
# word only when source and destination share their alignment.
#
# RX: the sink buffer starts 2 bytes into a word, as the payload does in the
# frame the DMA wrote.
CONFIG_EMACZ_APP_PAYLOAD_BUF_OFFSET=2
# TX: with the Ethernet header in the IP packet's buffer, the payload sits 2
# bytes into a word there too, so the copy from the app's buffer runs on
# words, and the driver copies one word-aligned frame into its DMA buffer
# instead of the IP packet to offset 14.
CONFIG_NET_L2_ETHERNET_RESERVE_HEADER=y
