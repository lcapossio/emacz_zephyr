# The frame buffers are cacheable (zcu106_r5.overlay) and the DMA does not
# snoop the D-cache: the AXI DMA driver cleans TX buffers before MM2S reads
# them and invalidates RX buffers before and after S2MM writes them.
CONFIG_DMA_XILINX_AXI_DMA_MANUAL_CACHE_COHERENCY=y
