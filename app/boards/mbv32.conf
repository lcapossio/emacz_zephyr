# The AXI Timer runs on the shell's 100 MHz SoC clock (SOC_CLK_HZ in
# hardware/scripts/build_arty_a7_mbv.py). Firmware-visible cycles_per_sec must
# match it, or every board-derived rate is biased.
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000

# The upstream board leaves serial off; the status prints use the UARTLite.
# With a UART driver on, the mbv32 SoC selects UART_CONSOLE, overriding
# prj.conf: only the boot banner and fault dumps reach it, as the app
# does not printk.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# The emacZero frame buffers sit in the D-cache aperture (emz_bufs in the
# overlay): the AXI DMA driver cleans each TX buffer before MM2S reads it
# and invalidates each RX buffer around the S2MM write.
CONFIG_CACHE_MANAGEMENT=y
CONFIG_DMA_XILINX_AXI_DMA_MANUAL_CACHE_COHERENCY=y

# MM2S sends each frame straight from the network buffer that holds it
# (cacheable RAM, cleaned by the AXI DMA driver) instead of a copy in
# emz_bufs.
CONFIG_ETH_EMACZERO_TX_ZERO_COPY=y
