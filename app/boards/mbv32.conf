# The AXI Timer runs on the shell's 100 MHz SoC clock (SOC_CLK_HZ in
# hardware/scripts/build_arty_a7_mbv.py). Firmware-visible cycles_per_sec must
# match it, or every board-derived rate is biased.
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000

# The upstream board leaves serial off; the status prints use the UARTLite.
# With a UART driver on, the mbv32 SoC selects UART_CONSOLE, overriding
# prj.conf: only the boot banner and fault dumps reach it, as the app
# does not printk.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
