# AXI Timer is driven by MIG ui_clk (sys_clk ~81.25 MHz), not the 100 MHz board
# oscillator. Firmware-visible cycles_per_sec must match or every board-derived
# rate is biased (was 23 % too high before this fix). Rounded from SOC_CLK_HZ
# in hardware/scripts/build_arty_a7_mbv.py so SYS_CLOCK_TICKS_PER_SEC=100
# evenly divides clock-frequency (~25 ppm error).
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=81250000
