# The SoC domain (CPU, AXI fabrics, peripherals, riscv_mtimer) runs at
# 100 MHz from clock_root/clk100. mtimer/aclk is tied to that same net, so
# this is the machine-timer input frequency. MIG's ui_clk stays at
# 81.25 MHz and is crossed inside ddr_axi_ic (smartconnect, NUM_CLKS 2) --
# the CDC is real, it is just not on the timer path.
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000
